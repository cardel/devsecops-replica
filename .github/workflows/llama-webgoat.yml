name: Replica LLaMA WebGoat

on:
  workflow_dispatch:

jobs:
  security:
    uses: cardel/devsecops-engine-/.github/workflows/reusable-devsecops.yml@f1317216adb0b9a1473ed7aaa8ff0cc323692d0d
    with:
      target_image:    'webgoat/webgoat:latest'
      target_port:     '8080'
      service_name:    'webgoat'
      criticality:     'high'
      environment:     'staging'
      source_repo:     'ManuelArango1229/WebGoatForkTG'
      source_repo_ref: 'main'
      language:        'java'
      use_ghcr:        false
    secrets:
      GROQ_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
      GHCR_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
