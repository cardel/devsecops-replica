name: Replica WebGoat

on:
  workflow_dispatch:

jobs:
  security:
    uses: cardel/devsecops-engine-/.github/workflows/reusable-devsecops.yml@027271f45f62514e43cfcbfe4a1635493f5edfe0
    with:
      target_image:    'webgoat/webgoat:latest'
      target_port:     '8080'
      service_name:    'webgoat'
      criticality:     'high'
      environment:     'staging'
      source_repo:     'ManuelArango1229/WebGoatForkTG'
      source_repo_ref: 'main'
      language:        'java'
      use_ghcr:        false
    secrets:
      GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GHCR_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
