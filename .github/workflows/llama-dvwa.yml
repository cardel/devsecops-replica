name: Replica LLaMA DVWA

on:
  workflow_dispatch:

jobs:
  security:
    uses: cardel/devsecops-engine-/.github/workflows/reusable-devsecops.yml@f1317216adb0b9a1473ed7aaa8ff0cc323692d0d
    with:
      target_image:    'vulnerables/web-dvwa:latest'
      target_port:     '80'
      service_name:    'dvwa'
      criticality:     'high'
      environment:     'staging'
      source_repo:     'ManuelArango1229/DVWAForkTG'
      source_repo_ref: 'master'
      language:        'php'
      use_ghcr:        false
    secrets:
      GROQ_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
      GHCR_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
